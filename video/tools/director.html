<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>director</title>
<style>
  html, body { margin: 0; width: 1440px; height: 900px; overflow: hidden; background: #fff; }
  iframe { position: absolute; inset: 0; width: 1440px; height: 900px; border: 0; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .cursor { position: absolute; width: 26px; height: 26px; margin: -2px 0 0 -3px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .ring { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
          background: rgba(33,143,253,.22); box-shadow: 0 0 0 3px rgba(33,143,253,.55); }
  .hl { position: absolute; border: 3px solid #218FFD; border-radius: 12px;
         box-shadow: 0 0 0 6px rgba(33,143,253,.18); }
  #out { display: none; }
</style>
</head>
<body>
<iframe id="f"></iframe>
<div id="overlay"></div>
<pre id="out">pending</pre>
<script>
// Сцены: страница, действия перед снимком, область для наезда камеры, курсор
const SCENES = {
  home:        { page: "index.html" },
  homeOffers:  { page: "index.html", focus: [".grid.grid--3"] },
  homeWork:    { page: "index.html", focus: [".rows"] },
  offerHalloween: { page: "index.html", focus: [".proposal:nth-child(1)"], hl: [".proposal:nth-child(1) .proposal__text"] },
  offerTax:    { page: "index.html", focus: [".proposal:nth-child(2)"], hl: [".proposal:nth-child(2) .proposal__text"] },
  offerCheese: { page: "index.html", focus: [".proposal:nth-child(3)"], hl: [".proposal:nth-child(3) .proposal__text"] },
  hints:       { page: "marketer.html", act: d => { d.querySelector('.chat__messages:not([hidden])').scrollTop = 0; },
                 hl: [".chat__messages:not([hidden]) .chips--wrap .chip:last-child", ".chat__composer .chips:not([hidden])"] },
  mkt:         { page: "marketer.html" },
  mktSteps:    { page: "marketer.html", focus: [".task:not([hidden]) .steps"], cursor: { sel: '.task:not([hidden]) .step[data-step="plan"]', dx: .5, dy: .5 } },
  mktBack:     { page: "marketer.html", act: d => d.querySelector('.task:not([hidden]) .step[data-step="plan"]').click(),
                 focus: [".task:not([hidden]) .steps", ".task:not([hidden]) .step-note", '.step-panel[data-panel="plan"] .card'],
                 cursor: { sel: ".task:not([hidden]) .step-note .btn", dx: .5, dy: .6 } },
  mktNext:     { page: "marketer.html", scrollTo: '.step-panel[data-panel="texts"] .next-step', focus: ['.step-panel[data-panel="texts"] .next-step'], hl: ['.step-panel[data-panel="texts"] .next-step__text'],
                 cursor: { sel: '.step-panel[data-panel="texts"] .next-step .btn', dx: .9, dy: .75, ring: true } },
  dsgWork:     { page: "designer.html", focus: [".task:not([hidden]) .working"], hl: [".task:not([hidden]) .meanwhile"] },
  dsgSpot:     { page: "designer.html", act: (d, w) => {
                   d.querySelector('.task-tab[data-task="cover"]').click();
                   // Та же разметка, что создаёт js/workspace.js по клику, но без фокуса в поле
                   const spot = d.querySelector('[data-task-id="cover"] .spot');
                   spot.insertAdjacentHTML("beforeend",
                     '<span class="spot__marker" style="left:46%;top:77%">2</span>' +
                     '<div class="spot__pop" style="left:46%;top:77%"><input type="text" value="Убрать палочку корицы">' +
                     '<div class="chips"><button class="chip" type="button">Убрать</button><button class="chip" type="button">Светлее</button>' +
                     '<button class="chip" type="button">Добавить пар</button></div></div>');
                 },
                 focus: ['[data-task-id="cover"] .spot', '[data-task-id="cover"] .card'],
                 cursor: { sel: '[data-task-id="cover"] .spot__marker:last-of-type', dx: .5, dy: .5, ring: true } },
  finDash:     { page: "financier.html", focus: [".task:not([hidden]) .grid--4", ".task:not([hidden]) .stack"], hl: [".task:not([hidden]) .insight"],
                 cursor: { sel: ".task:not([hidden]) .insight .btn", dx: .5, dy: .6 } },
  imagesNotice: { page: "images.html", focus: [".next-step"], hl: [".next-step__text"] },
  assistantCare: { page: "assistant.html", scrollTo: ".task:not([hidden]) .next-step", focus: [".task:not([hidden]) .next-step"], hl: [".task:not([hidden]) .next-step__text"] },
  oneChat:     { page: "designer.html", focus: [".chat"] },
  taskChats:   { page: "marketer.html", act: d => d.querySelector('.task-tab[data-task="veranda"]').click(),
                 focus: [".chat", ".task-tabs"], cursor: { sel: '.task-tab[data-task="veranda"]', dx: .94, dy: .75, ring: true } },
  taskBrief:   { page: "marketer.html", act: d => { d.querySelector('.chat__head:not([hidden]) .brief').open = true; },
                 focus: [".chat__head:not([hidden])"], cursor: { sel: ".chat__head:not([hidden]) .brief__toggle", dx: .3, dy: .5 } },
  chatSummary: { page: "marketer.html", act: d => { d.querySelector('.chat__messages:not([hidden])').scrollTop = 0; },
                 cursor: { sel: ".chat__messages:not([hidden]) .chat__divider .chat__summary", dx: .62, dy: .75 } },
  settingsPersona: { page: "settings.html", focus: [".persona"], cursor: { sel: ".persona .skill--add", dx: .5, dy: .6 } },
  settingsInit: { page: "settings.html", focus: [".persona .initiative"], cursor: { sel: ".persona input[type=range]", dx: .72, dy: .5 } },
  settings:    { page: "settings.html", focus: [".persona"], cursor: { sel: ".persona input[type=range]", dx: .72, dy: .5 } },
  final:       { page: "marketer.html" }
};

const id = new URLSearchParams(location.search).get("s");
const sc = SCENES[id];
const f = document.getElementById("f");
f.src = "../" + sc.page + "?video=" + Date.now();

const arrow = '<svg class="cursor" viewBox="0 0 24 24"><path d="M3 2l7 19 2.6-7.4L20 11z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>';

f.onload = async () => {
  const d = f.contentDocument, w = f.contentWindow;
  try { await d.fonts.ready; await d.fonts.load("400 14px Inter", "Привет"); } catch (e) {}
  // Для съёмки: без плавных переходов, иначе кадр ловит середину анимации
  const st = d.createElement("style");
  st.textContent = "*, *::before, *::after { transition: none !important; }";
  d.head.appendChild(st);
  await new Promise(r => setTimeout(r, 400));
  if (sc.act) sc.act(d, w);
  await new Promise(r => setTimeout(r, 300));
  // Фокус в полях сдвигает страницу при съёмке — снимаем его и сбрасываем прокрутку
  if (d.activeElement && d.activeElement.blur) d.activeElement.blur();
  window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
  if (!sc.scrollTo) w.scrollTo(0, 0);
  await new Promise(r => setTimeout(r, 100));
  // Фоновый Chrome иногда не перерисовывает часть кадра после действий — перерисовать целиком
  f.style.display = "none"; void f.offsetHeight; f.style.display = "";
  await new Promise(r => setTimeout(r, 300));
  if (sc.scrollTo) {
    const el = d.querySelector(sc.scrollTo);
    w.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + w.scrollY - 360));
    await new Promise(r => setTimeout(r, 200));
  }
  // Область фокуса — объединение прямоугольников элементов
  let focus = null;
  (sc.focus || []).forEach(sel => {
    const el = d.querySelector(sel); if (!el) return;
    const r = el.getBoundingClientRect();
    const b = [r.left, r.top, r.right, r.bottom];
    focus = focus ? [Math.min(focus[0], b[0]), Math.min(focus[1], b[1]), Math.max(focus[2], b[2]), Math.max(focus[3], b[3])] : b;
  });
  // Подсветку рамкой убрали по решению Алексея: камера просто наезжает на текст (focus)
  const ov = document.getElementById("overlay");
  // Курсор и подсветка клика
  if (sc.cursor) {
    const el = d.querySelector(sc.cursor.sel);
    if (el) {
      const r = el.getBoundingClientRect();
      const x = r.left + r.width * sc.cursor.dx, y = r.top + r.height * sc.cursor.dy;
      if (sc.cursor.ring) ov.insertAdjacentHTML("beforeend", `<span class="ring" style="left:${x}px;top:${y}px"></span>`);
      ov.insertAdjacentHTML("beforeend", arrow.replace('class="cursor"', `class="cursor" style="left:${x}px;top:${y}px"`));
    }
  }
  document.getElementById("out").textContent = JSON.stringify({ id, focus });
};
</script>
</body>
</html>
